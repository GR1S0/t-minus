<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T-Minus</title>
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F2F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0C0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="T-Minus">
<meta name="application-name" content="T-Minus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Porta d'ingresso: l'app è cifrata qui sotto e si apre con l'impronta o col codice. Font di sistema: i Pangram sono dentro la parte cifrata */
  :root{--bg:#F4F2F1;--surface:#FFFFFF;--fg:#171313;--muted:#68605C;--line:#E0DAD6;--accent:#F0561A;--accent-2:#C21E2B;--bad:#C2181F;
    --heat:linear-gradient(135deg,var(--accent) 0%,var(--accent) 40%,var(--accent-2) 135%);--glow:0 4px 18px rgba(240,86,26,.34)}
  @media (prefers-color-scheme: dark){:root{--bg:#0E0C0B;--surface:#191615;--fg:#F4EFEC;--muted:#A39A95;--line:#2D2826;--accent:#FF6B2C;--accent-2:#EC3338;--bad:#FF6B5B;
    --glow:0 0 22px rgba(255,107,44,.42),0 0 2px rgba(255,140,80,.6);color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;
    padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  main{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  img{width:112px;height:112px;border-radius:26px;box-shadow:0 18px 50px rgba(242,107,56,.28)}
  h1{margin:0;font-size:34px;font-weight:900;font-style:italic;letter-spacing:-.01em}
  p{margin:0;color:var(--muted)}
  .err{color:var(--bad);min-height:1.45em}
  form,.box{width:100%;display:flex;flex-direction:column;gap:10px}
  input{width:100%;font:inherit;font-size:24px;letter-spacing:.3em;text-align:center;padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{font:inherit;font-weight:700;border-radius:14px;padding:15px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
  button.go{background:var(--heat);border-color:transparent;color:#fff;box-shadow:var(--glow)}
  button:disabled{opacity:.5;cursor:default}
  button.link{background:none;border:0;color:var(--muted);font-weight:500;padding:6px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>T-Minus</h1>

  <div class="box" id="v-bio" hidden>
    <button class="go" id="bio" type="button">Sblocca con l'impronta</button>
    <button class="link" id="use-pin" type="button">Usa il codice</button>
  </div>

  <form id="v-pin" autocomplete="off" hidden>
    <p>Inserisci il codice per aprire il timer.</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Codice a 6 cifre">
    <button class="go" id="go" type="submit">Sblocca</button>
  </form>

  <div class="box" id="v-offer" hidden>
    <p id="offer-text">Come vuoi aprire T-Minus la prossima volta?</p>
    <button class="go" id="bio-on" type="button">Con l'impronta</button>
    <button id="remember" type="button">Senza codice, su questo telefono</button>
    <button class="link" id="skip" type="button">Chiedi sempre il codice</button>
  </div>

  <p class="err" id="err" role="alert"></p>
</main>

const enc = new TextEncoder(), $ = s => document.getElementById(s);
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));

const PRF_INPUT = enc.encode('T-minus sblocco v1');

            del(k) { try { localStorage.removeItem(k); } catch (e) {} }};
const aes = (raw, use) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, use);

function show(view) { for (const v of ['v-bio', 'v-pin', 'v-offer']) $(v).hidden = v !== view; if (view === 'v-pin') setTimeout(() => $('pin').focus(), 50); }
const err = t => { $('err').textContent = t || ''; };

// apre l'app: decifra e mette la pagina vera al posto di questa, nello stesso documento (niente document.write,
// che su Android può far trattare la pagina come esterna all'app installata e far comparire la barra di Chrome)
async function openApp(k) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(PAYLOAD.iv)}, await aes(k, ['decrypt']), unb64(PAYLOAD.ct)));
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.head.replaceChildren(...doc.head.childNodes);
  document.body.replaceChildren(...doc.body.childNodes);
  // gli script arrivati dal parser non partono da soli: li ricreo, nell'ordine
  for (const old of [...document.querySelectorAll('script')]) { const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s); }
}

async function keyFromPin(pin) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: unb64(PIN.salt), iterations: PIN.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(PIN.iv)}, kek, unb64(PIN.ct)));
}

/* Impronta: la passkey del telefono, con l'estensione PRF, restituisce un segreto che esiste solo dopo il riconoscimento.
   Quel segreto cifra la chiave dell'app qui sul telefono: senza impronta resta illeggibile */
async function prfFrom(id) {
  const a = await navigator.credentials.get({publicKey: {challenge: rand(32), rpId: location.hostname, userVerification: 'required',
    allowCredentials: [{type: 'public-key', id: unb64(id)}], extensions: {prf: {eval: {first: PRF_INPUT}}}}});
  const out = a.getClientExtensionResults().prf?.results?.first;
  if (!out) throw new Error('noprf');
  return out;
}
async function bioCreate() {
  const c = await navigator.credentials.create({publicKey: {
    rp: {name: 'T-Minus', id: location.hostname}, user: {id: rand(16), name: 'T-Minus', displayName: 'T-Minus'}, challenge: rand(32),
    pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
    authenticatorSelection: {authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required'},
    extensions: {prf: {eval: {first: PRF_INPUT}}}}});
  const prf = c.getClientExtensionResults().prf;
  if (!prf || prf.enabled === false) throw new Error('noprf');
  return {id: b64(c.rawId), out: prf.results?.first || null};
}
async function bioStore(id, out, k) {
  const iv = rand(12), ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await aes(new Uint8Array(out).slice(0, 32), ['encrypt']), k);
  ls.set('tm-bio', {id, iv: b64(iv), ct: b64(ct)}); ls.del('tm-bio-wait');
}
async function bioUnlock() {
  const bio = ls.get('tm-bio');
  const out = await prfFrom(bio.id);
  const k = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(bio.iv)}, await aes(new Uint8Array(out).slice(0, 32), ['decrypt']), unb64(bio.ct)));
  await openApp(k);
}

let pending = null; // chiave appena sbloccata col codice, in attesa di decidere sull'impronta
$('v-pin').addEventListener('submit', async e => {
  e.preventDefault(); err();
  const pin = $('pin').value.trim();
  if (!pin || $('go').disabled) return;
  $('go').disabled = true; $('go').textContent = 'Controllo…';
  let k;
  try { k = await keyFromPin(pin); } catch (x) { $('go').disabled = false; $('go').textContent = 'Sblocca'; $('pin').value = ''; $('pin').focus(); return err('Codice sbagliato.'); }
  if (ls.get('tm-bio') || ls.get('tm-ask')) return openApp(k);
  pending = k;
  if (!window.PublicKeyCredential) $('bio-on').hidden = true;
  show('v-offer');
});

$('bio-on').addEventListener('click', async () => {
  err();
  try {
    const wait = ls.get('tm-bio-wait');
    // su iPhone la creazione e la lettura della passkey possono chiedere due tocchi separati
    const c = wait ? {id: wait, out: null} : await bioCreate();
    const out = c.out || await prfFrom(c.id).catch(x => { ls.set('tm-bio-wait', c.id); throw x; });
    await bioStore(c.id, out, pending);
    openApp(pending);
  } catch (x) {
    if (x.message === 'noprf') {
      ls.del('tm-bio-wait');
      $('offer-text').textContent = 'L\'impronta qui non funziona: la passkey è finita in un gestore che non la supporta. Puoi aprire T-Minus senza codice su questo telefono.';
      $('bio-on').hidden = true;
    } else if (ls.get('tm-bio-wait')) { $('bio-on').textContent = 'Conferma l\'impronta'; err('Tocca ancora per confermare l\'impronta.'); }
    else err('Passkey non creata. Se compare NordPass o un altro gestore, scegli Google Password Manager, oppure usa "Senza codice".');
  }
});
$('remember').addEventListener('click', () => { ls.set('tm-k', b64(pending)); openApp(pending); });
$('skip').addEventListener('click', () => { ls.set('tm-ask', true); ls.del('tm-bio-wait'); openApp(pending); });

$('bio').addEventListener('click', async () => {
  err();
  try { await bioUnlock(); }
  catch (x) { err('Impronta non riconosciuta. Riprova o usa il codice.'); }
});
// alla sesta cifra parte da solo, senza toccare Sblocca
$('pin').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) $('v-pin').requestSubmit(); });
$('use-pin').addEventListener('click', () => { err(); show('v-pin'); });

(async function start() {
  const kept = ls.get('tm-k');
  if (kept) { try { return await openApp(unb64(kept)); } catch (x) { ls.del('tm-k'); } }
  if (ls.get('tm-bio')) {
    show('v-bio');
    // Android apre l'impronta da solo; Safari vuole un tocco, e allora resta il pulsante
    try { await bioUnlock(); } catch (x) {}
    return;
  }
  show('v-pin');
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
